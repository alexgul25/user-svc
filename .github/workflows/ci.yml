# CI для User Service: линтеры, поиск уязвимостей, unit-, интеграционные и E2E-тесты, проверка Docker-образа.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ручной запуск из вкладки Actions.
  workflow_dispatch:
  # Еженедельный прогон: новые уязвимости публикуются и без изменений в коде.
  schedule:
    - cron: "0 5 * * 1" # понедельник, 08:00 МСК

# GITHUB_TOKEN получает только право читать код.
permissions:
  contents: read

# Новый пуш в PR отменяет устаревший прогон; прогоны в main не отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Версия Go берётся из директивы go в go.mod, кэш модулей - по go.sum.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Падает, если go.mod или go.sum не приведены в порядок через go mod tidy.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Набор линтеров и форматтеров описан в .golangci.yml (go vet входит в него).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Ищет известные уязвимости в зависимостях и стандартной библиотеке
      # и сообщает только о тех, до которых реально доходит код сервиса.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Отдельная проверка, что собираются все пакеты, включая оба бинарника из cmd/.
      - name: Build
        run: go build ./...

      # Быстрая проверка без БД; -race ловит гонки данных.
      - name: Test
        run: go test -race ./...

  integration:
    name: Integration tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Падение на одной версии PostgreSQL не отменяет проверку на другой.
      fail-fast: false
      matrix:
        # Самая старая поддерживаемая версия и самая новая.
        postgres: ["15", "18"]
    services:
      # GitHub запускает контейнер с PostgreSQL и ждёт, пока health-check не станет успешным.
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_svc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_svc_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Все тесты, включая интеграционные и E2E, с общим покрытием всего сервиса
      # (вместе с кодом, выполненным в бинарниках) - та же команда, что и локально.
      # Шаг падает, если покрытие ниже порога COVER_MIN из Makefile
      # или какой-то пакет сервиса не попал в отчёт о покрытии.
      # TEST_DATABASE_URL задан выше, поэтому make не запускает свой контейнер с PostgreSQL.
      - name: Test
        run: make test-cover

      # Итог покрытия попадает на страницу прогона (Summary), HTML-отчёт - в артефакт.
      # Отчёт один: с последней версии PostgreSQL. Он формируется и тогда,
      # когда шаг Test упал из-за порога, чтобы было видно, где покрытие просело.
      - name: Coverage report
        if: matrix.postgres == '18' && !cancelled() && hashFiles('coverage.out') != ''
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "### Покрытие тестами: ${total}"
            echo
            echo "<details><summary>Покрытие по функциям</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: matrix.postgres == '18' && !cancelled() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_svc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      # Сборка образа проверяет и Dockerfile, и то, что код собирается в нём.
      - name: Build image
        run: docker build -t user-svc:ci .

      # Тот же скрипт, что и make docker-smoke: миграции, запуск, health-check, остановка.
      - name: Smoke test
        run: bash scripts/docker-smoke.sh user-svc:ci
